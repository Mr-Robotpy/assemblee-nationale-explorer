name: Mise à jour des données et déploiement

# Les JSON générés vivent sur la branche `data` (un seul commit, réécrit à chaque passage) :
#  - `main` ne contient que le code : pas de commit quotidien, pas de conflit avec vos pushes ;
#  - si le serveur de l'AN est indisponible, on redéploie les données de la veille ;
#  - les textes intégraux déjà récupérés sont conservés d'un passage à l'autre.

on:
  schedule:
    # Tous les jours à 04:23 UTC (≈ 05:23 / 06:23 à Paris). Les archives AN sont régénérées dans la nuit.
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      forcer_volumes:
        description: "Publier malgré une baisse anormale de volume (après vérification à la source)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - "README.md"

permissions:
  contents: write   # écriture de la branche `data`
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      generation: ${{ steps.build.outcome }}
      echecs: ${{ steps.etat.outputs.echecs }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests du pipeline (hors ligne)
        run: python -m unittest discover -s tests -v

      - name: Restauration des données précédentes (branche data)
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            git archive FETCH_HEAD | tar -x -C data
            echo "Données précédentes restaurées : $(find data -type f | wc -l) fichiers"
          else
            echo "Pas encore de branche data (premier passage)."
          fi

      - name: Génération des JSON depuis l'Open Data AN
        id: build
        # En cas d'indisponibilité du serveur AN, on redéploie les données précédentes.
        continue-on-error: true
        env:
          FORCE_VOLUMES: ${{ inputs.forcer_volumes && '1' || '' }}
        run: python scripts/build_data.py

      - name: État des données (sections en échec)
        id: etat
        if: steps.build.outcome == 'success'
        run: |
          echecs=$(python -c "import json; print(' '.join(json.load(open('data/meta.json')).get('echecs', [])))")
          echo "echecs=${echecs}" >> "$GITHUB_OUTPUT"

      - name: Publication sur la branche data
        if: steps.build.outcome == 'success'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf /tmp/data-branch && cp -r data /tmp/data-branch && cd /tmp/data-branch
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "data: Open Data AN du $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data:data

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Tests du front (géométrie, node --test)
        run: node --test tests/*.test.mjs

      - name: Compilation CSS (Tailwind)
        run: |
          npm ci --no-audit --no-fund
          npm run build:css

      - uses: actions/configure-pages@v5
        id: pages

      - name: Préparation du site
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          mkdir -p _site
          cp -r index.html assets data _site/
          touch _site/.nojekyll
          # Version propre au déploiement : le navigateur ne peut pas associer le nouvel index.html
          # à un ancien app.js resté en cache (GitHub Pages autorise 10 min de cache).
          # Concerne nos fichiers assets/*.css|js (pas assets/vendor/, déjà versionné par dossier).
          v="${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"
          n=$(grep -cE '"assets/[a-z]+\.(css|js)"' _site/index.html)
          sed -i -E "s#\"(assets/[a-z]+\.(css|js))\"#\"\1?v=${v}\"#g" _site/index.html
          test "$n" -ge 3 && test "$(grep -c "?v=${v}" _site/index.html)" -eq "$n" || { echo "Versionnage des assets incomplet dans index.html"; exit 1; }
          # Pages statiques (une par député et par dossier), plan du site et page 404 : dérivés des JSON à chaque
          # déploiement, y compris quand la génération a échoué et que les données sont celles de la veille.
          python scripts/build_pages.py --data data --out _site --base-url "${BASE_URL}" --version "${v}"
          test -s _site/sitemap.xml && test -s _site/depute/index.html && test -s _site/dossier/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Le site est redéployé même quand la génération échoue (données de la veille) : sans ce contrôle, le passage
  # resterait vert et une panne durerait sans que personne ne soit prévenu. Un passage rouge déclenche le courriel
  # de GitHub ; il ne bloque pas le déploiement, lancé en parallèle.
  controle:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Données à jour ?
        env:
          GENERATION: ${{ needs.build.outputs.generation }}
          ECHECS: ${{ needs.build.outputs.echecs }}
        run: |
          if [ "$GENERATION" != "success" ]; then
            echo "::error::La génération des données a échoué : le site a été redéployé avec les données précédentes."
            exit 1
          fi
          if [ -n "$ECHECS" ]; then
            echo "::error::Sections non rafraîchies (données précédentes conservées) : $ECHECS"
            exit 1
          fi
          echo "Toutes les sections ont été rafraîchies."
