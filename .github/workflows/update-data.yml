name: Mise à jour des données et déploiement

# Les JSON générés vivent sur la branche `data` (un seul commit, réécrit à chaque passage) :
#  - `main` ne contient que le code : pas de commit quotidien, pas de conflit avec vos pushes ;
#  - si le serveur de l'AN est indisponible, on redéploie les données de la veille ;
#  - les textes intégraux déjà récupérés sont conservés d'un passage à l'autre.

on:
  schedule:
    # Tous les jours à 04:23 UTC (≈ 05:23 / 06:23 à Paris). Les archives AN sont régénérées dans la nuit.
    - cron: "23 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"

permissions:
  contents: write   # écriture de la branche `data`
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests du pipeline (hors ligne)
        run: python -m unittest discover -s tests -v

      - name: Restauration des données précédentes (branche data)
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            git archive FETCH_HEAD | tar -x -C data
            echo "Données précédentes restaurées : $(find data -type f | wc -l) fichiers"
          else
            echo "Pas encore de branche data (premier passage)."
          fi

      - name: Génération des JSON depuis l'Open Data AN
        id: build
        # En cas d'indisponibilité du serveur AN, on redéploie les données précédentes.
        continue-on-error: true
        run: python scripts/build_data.py

      - name: Publication sur la branche data
        if: steps.build.outcome == 'success'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf /tmp/data-branch && cp -r data /tmp/data-branch && cd /tmp/data-branch
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "data: Open Data AN du $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data:data

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compilation CSS (Tailwind)
        run: |
          npm ci --no-audit --no-fund
          npm run build:css

      - uses: actions/configure-pages@v5

      - name: Préparation du site
        run: |
          mkdir -p _site
          cp -r index.html assets data _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
